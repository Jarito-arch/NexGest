<div class="topBar">
    <button type="button" class="menuButton" aria-label="Abrir menú de navegación" aria-controls="menu-lateral"
        [attr.aria-expanded]="menuAbierto()" (click)="menu.emit()">
        <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <div class="pageInfo">
        <span>{{fecha | longDate}}</span>
        <h1>{{titulo()}}</h1>
    </div>

    <div class="topBarActions">
        <a routerLink="/notificacion" class="notification"
            [attr.aria-label]="avisos.sinLeer() ? 'Notificaciones, ' + avisos.sinLeer() + ' sin leer' : 'Notificaciones'">
            <i class="bi bi-bell" aria-hidden="true"></i>
            @if (avisos.sinLeer() > 0) {
                <span class="notificationDot"></span>
            }
        </a>
        <div class="profileBox">
            <div class="profile" aria-hidden="true">{{ auth.initials() }}</div>
            <span class="profileName">{{ auth.userName() || 'Mi cuenta' }}</span>
        </div>
        <button type="button" class="logout" title="Cerrar sesión" (click)="logout()">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            <span>Cerrar sesión</span>
        </button>
    </div>
</div>
