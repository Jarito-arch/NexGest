<div class="topBar">
    <div class="pageInfo">
        <span>{{fecha | longDate}}</span>
        <h1>{{titulo()}}</h1>
    </div>

    <div class="topBarActions">
        <a routerLink="/notificacion" class="notification"><i class="bi bi-bell"></i>
            <span class="notificationDot"></span>
        </a>
        <div class="profile">CA</div>
        <button type="button" class="logout" title="Cerrar sesión" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>Cerrar sesión</span>
        </button>
    </div>
</div>
