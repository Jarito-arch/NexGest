<app-auth-layout>
  <app-auth-card>
    <div class="login-content">
      <div class="badge">● Acceso seguro NexGest</div>

      <h1>Bienvenido de nuevo</h1>

      <p>Gestiona tu negocio de forma inteligente</p>

      <app-form-field label="Correo electrónico" placeholder="correo@empresa.com" type="email">
      </app-form-field>

      <app-form-field label="Contraseña" placeholder="********" type="password"> </app-form-field>

      <div class="forgot">¿Olvidaste tu contraseña?</div>

      <app-primary-button> Ingresar → </app-primary-button>

      <div class="register">
        ¿No tienes una cuenta?

        <span> Crear cuenta </span>
      </div>
    </div>
  </app-auth-card>
</app-auth-layout>
