<main class="not-found">
  <div class="not-found-card">
    <span class="not-found-code" aria-hidden="true">404</span>
    <h1>No encontramos esta página</h1>
    <p>Es posible que el enlace haya cambiado o que la dirección esté mal escrita.</p>
    <div class="not-found-actions">
      <a class="btn-primary" routerLink="/">
        <i class="bi bi-house" aria-hidden="true"></i> Volver al inicio
      </a>
      <button type="button" class="btn-ghost" (click)="volver()">Regresar</button>
    </div>
  </div>
</main>
