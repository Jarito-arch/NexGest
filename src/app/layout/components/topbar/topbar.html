<div class="topBar">
    <button type="button" class="menuButton" aria-label="Abrir menú de navegación" aria-controls="menu-lateral"
        [attr.aria-expanded]="menuAbierto()" (click)="menu.emit()">
        <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <div class="pageInfo">
        <span>{{fecha | longDate}}</span>
        <h1>{{titulo()}}</h1>
    </div>

    <div class="topBarActions">
        <div class="profileBox">
            @if (permisos.esPropietario()) {
                <a routerLink="/configuracion" class="profile" title="Configuración del negocio" aria-label="Ir a configuración">{{ iniciales() }}</a>
            } @else {
                <div class="profile" aria-hidden="true">{{ iniciales() }}</div>
            }
            <span class="profileName">{{ auth.userName() || 'Mi cuenta' }}</span>
        </div>
        <button type="button" class="logout" title="Cerrar sesión" (click)="logout()">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            <span>Cerrar sesión</span>
        </button>
    </div>
</div>
