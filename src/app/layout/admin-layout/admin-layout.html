<div class="app-layout">
  <app-sidebar class="sidebar" id="menu-lateral" [class.open]="menuAbierto()"></app-sidebar>
  @if (menuAbierto()) {
    <div class="menu-backdrop" aria-hidden="true" (click)="menuAbierto.set(false)"></div>
  }
  <div class="main-content">
    <app-topbar [menuAbierto]="menuAbierto()" (menu)="alternarMenu()"></app-topbar>
    <div class="page-content">
      <router-outlet />
    </div>
  </div>
</div>
